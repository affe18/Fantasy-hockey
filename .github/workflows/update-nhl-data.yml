name: Refresh NHL data and hockey news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rinkiq-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest public NHL and ESPN data
        run: python scripts/update_nhl_data.py
      - name: Commit updated data snapshot
        run: |
          if git diff --quiet -- data/nhl-data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nhl-data.json
          git commit -m "Refresh NHL stats and hockey news"
          git push
